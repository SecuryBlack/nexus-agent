[package]
name = "nexus-agent"
version = "0.2.11"
edition = "2024"
license = "Apache-2.0"
description = "SecuryBlack agent — tunnel, orchestrator and CI/CD deployer for client servers"
repository = "https://github.com/securyblack/nexus-agent"

[dependencies]
sb-agent-core = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
anyhow = "1.0"
dotenvy = "0.15"
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
opentelemetry-proto = { version = "0.27", features = ["gen-tonic", "metrics"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[profile.release]
opt-level = 3
lto = true
strip = true

# TEMPORAL: sb-agent-core está publicado en crates.io como 0.1.0, pero el
# intake de comandos (`command_intake`, `command_intake_client`) solo está
# en GitHub todavía (commit 8a342a9) — no se ha publicado ninguna versión
# nueva del crate. Quitar este patch (y volver a `sb-agent-core = "0.1"`
# normal, o a la versión que corresponda) en cuanto se publique.
[patch.crates-io]
sb-agent-core = { git = "https://github.com/SecuryBlack/sb-agent-core.git", rev = "ed48bcc" }
